services:
  pingador:
    build: .
    container_name: pingador
    restart: unless-stopped
    # Sem "ports": o container fica acessível só via rede Docker compartilhada
    # com o Nginx Proxy Manager (npm_network abaixo), nem localhost fica exposto.
    networks:
      - default
      - npm_network
    volumes:
      # Planilha de inventario "de verdade" na VM, montada no caminho que o
      # container le/observa (ver PINGADOR_EXCEL_PATH no Dockerfile).
      - "./Inventario IP.xlsx:/app/data/Inventario IP.xlsx"
      # Banco SQLite com o historico de disponibilidade / ultima vez online.
      # Volume nomeado para o historico sobreviver a recriacao do container.
      - "pingador_db:/app/data/db"
    environment:
      - PINGADOR_EXCEL_SYNC_INTERVAL=60
      - PINGADOR_EXCEL_DEFAULT_FREQUENCY=15
      - PINGADOR_DB_PATH=/app/data/db/pingador.db
      - PINGADOR_DB_RETENTION_DAYS=30
    # Descomente para pingar equipamentos na mesma rede da VM sem NAT
    # (mais simples quando o Proxmox usa uma bridge de rede local):
    # network_mode: host

volumes:
  pingador_db: {}

networks:
  default: {}
  # Rede do Nginx Proxy Manager (definida em /opt/nginx-proxy-manager na VM).
  # external: true = não recriar, só se conectar à que já existe.
  npm_network:
    external: true
    name: nginx-proxy-manager_default
