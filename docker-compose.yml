services:
  pingador:
    build: .
    container_name: pingador
    restart: unless-stopped
    # Sem "ports": o container fica acessível só via rede Docker compartilhada
    # com o Nginx Proxy Manager (npm_network abaixo), nem localhost fica exposto.
    networks:
      - default
      - npm_network
    volumes:
      # Banco SQLite: cadastro dos equipamentos + historico de disponibilidade.
      # Volume nomeado para sobreviver a recriacao do container.
      - "pingador_db:/app/data/db"
      # Import unico da planilha (rodar uma vez):
      #   docker compose run --rm \
      #     -v "$PWD/Inventario IP.xlsx:/app/data/Inventario IP.xlsx" \
      #     pingador python import_inventory.py
    environment:
      # Fuso do container: sem isso os horarios ficam em UTC (3h a frente).
      - TZ=America/Sao_Paulo
      - PINGADOR_DB_PATH=/app/data/db/pingador.db
      - PINGADOR_DB_RETENTION_DAYS=30
    # Descomente para pingar equipamentos na mesma rede da VM sem NAT
    # (mais simples quando o Proxmox usa uma bridge de rede local):
    # network_mode: host

volumes:
  pingador_db: {}

networks:
  default: {}
  # Rede do Nginx Proxy Manager (definida em /opt/nginx-proxy-manager na VM).
  # external: true = não recriar, só se conectar à que já existe.
  npm_network:
    external: true
    name: nginx-proxy-manager_default
